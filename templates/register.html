{% extends "base.html" %}
{% block title %}{{ t('register_title') }} — {{ t('app_name') }}{% endblock %}
{% block body %}
<div class="page page-narrow">
  <div class="demo-notice" role="alert">
    <span>🥼</span>
    <span>{{ t('demo_notice') }}</span>
  </div>
  <div class="section-title"><h1 style="font-size:1.4rem; margin:0;">{{ t('register_title') }}</h1></div>
  <p style="font-size:.9rem;">{{ t('register_body') }}</p>

  <div class="card">
    <form method="POST">
      <input type="hidden" name="role" value="citizen">
      <label for="name">{{ t('full_name') }}</label>
      <input type="text" id="name" name="name" required autofocus>

      <label for="email">{{ t('email') }}</label>
      <input type="email" id="email" name="email" required>

      <label for="phone">{{ t('phone') }}</label>
      <input type="tel" id="phone" name="phone" required>

      <label for="password">{{ t('password') }}</label>
      <input type="password" id="password" name="password" required minlength="6">

      <div style="margin-top:22px;">
        <button type="submit" class="btn btn-primary btn-block">{{ t('btn_create_account') }}</button>
      </div>
    </form>
  </div>

  <p style="margin-top:16px; font-size:.88rem; text-align:center;">
    {{ t('already_registered') }} <a href="{{ url_for('login', role='citizen') }}" style="color:var(--sal); font-weight:600;">{{ t('btn_login') }}</a>
  </p>
</div>
{% endblock %}
