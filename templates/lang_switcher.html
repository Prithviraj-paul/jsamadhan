<form class="lang-switch" method="POST" action="{{ url_for('set_lang') }}">
  <select name="lang" aria-label="{{ t('language') }}" onchange="this.form.submit()">
    <optgroup label="Main / मुख्य">
      {% for code, native, english, group, fb in LANGS if group == 'primary' %}
      <option value="{{ code }}" {{ 'selected' if code == current_lang_code }}>{{ native }}</option>
      {% endfor %}
    </optgroup>
    <optgroup label="Jharkhand / झारखंड">
      {% for code, native, english, group, fb in LANGS if group == 'jharkhand' %}
      <option value="{{ code }}" {{ 'selected' if code == current_lang_code }}>{{ native }}</option>
      {% endfor %}
    </optgroup>
    <optgroup label="Other Indian Languages">
      {% for code, native, english, group, fb in LANGS if group == 'india' %}
      <option value="{{ code }}" {{ 'selected' if code == current_lang_code }}>{{ native }}</option>
      {% endfor %}
    </optgroup>
  </select>
</form>
